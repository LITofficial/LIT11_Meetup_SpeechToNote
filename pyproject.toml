[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-transcriber"
version = "0.2.0"
description = "Offline Korean transcription demo"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn", "python-multipart", "av", "faster-whisper==1.2.1", "httpx==0.28.1", "reportlab==5.1.0"]

[project.optional-dependencies]
test = ["pytest", "httpx", "pymupdf==1.28.2", "playwright==1.64.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lecture_transcriber = ["static/*", "fonts/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
